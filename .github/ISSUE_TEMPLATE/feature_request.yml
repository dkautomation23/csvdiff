name: Feature request
description: Suggest a normalization rule, an output format, or a flag csvdiff doesn't have yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to compare or report?
      description: >-
        A value format, a matching behavior, or an output that csvdiff
        currently doesn't support.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should csvdiff do
      description: A new flag, a new normalization rule, a new output — be as concrete as you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried instead
      description: A workaround, another tool, a manual check — helps judge how much this is worth.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this
          required: false
